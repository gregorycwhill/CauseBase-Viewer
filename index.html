<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CauseBase is a public, source-linked charity-data reference for Australia.">
  <link rel="canonical" href="https://gregorycwhill.github.io/CauseBase-Viewer/">
  <link rel="alternate" type="application/json" href="./current-release.json" title="Current CauseBase release">
  <title>CauseBase Viewer — Australian charity data</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <strong>CauseBase Viewer</strong>
      <span>Inspect Australian charity data</span>
      <small class="test-marker">CauseBase — early test version</small>
    </div>
    <nav>
      <a href="./public/data/manifest.json">Dataset manifest</a>
      <a href="./commitments.html">Commitments</a>
      <a id="feedback-link" href="./correction.html">About &amp; feedback</a>
    </nav>
  </header>

  <main class="layout">
    <aside class="index-pane">
      <label for="search">Search CauseBase</label>
      <input id="search" type="search" placeholder="name, place, activity, taxonomy…">
      <p class="test-scope">Early test release · 120 selected Australian charities</p>
      <div id="facets" class="facets" aria-label="Browse filters"></div>
      <p id="result-count" class="muted"></p>
      <div id="results" class="results" role="list"></div>
    </aside>

    <article id="card" class="card-pane">
      <div class="empty">Loading CauseBase…</div>
    </article>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
