name: Deploy CharityGraph site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: gregorycwhill/charitygraph-data
          ref: main
          path: charitygraph-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Viewer tests
        run: npm test
      - name: Build allowlisted deployment bundle
        env:
          CHARITYGRAPH_DATA_RELEASE_DIR: ${{ github.workspace }}/charitygraph-data/releases/v0.5.0-2026-08-15
        run: npm run prepare-from-data
      - name: Publish static bundle to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add ../charitygraph-pages gh-pages
          git -C ../charitygraph-pages rm -rf .
          cp -a dist/. ../charitygraph-pages/
          git -C ../charitygraph-pages add --all
          if git -C ../charitygraph-pages diff --cached --quiet; then
            echo "No deployment changes; gh-pages already matches the validated bundle."
            exit 0
          fi
          git -C ../charitygraph-pages -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy CharityGraph site ${GITHUB_SHA}"
          git -C ../charitygraph-pages push origin gh-pages
